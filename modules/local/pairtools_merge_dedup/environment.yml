---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Same tool pins as legacy/snakemake/env/rcmc_conda.yaml (minus snakemake) so results match the original pipeline.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12
  - bioconda::bwa-mem2=2.3
  - bioconda::pairtools=1.1.3
  - bioconda::cooler=0.10.4
  - bioconda::bedops=2.4.42
  - bioconda::bedtools=2.31.1
  - conda-forge::procps-ng
